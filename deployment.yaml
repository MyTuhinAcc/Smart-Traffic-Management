
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-traffic
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: smart-traffic
  template:
    metadata:
      labels:
        app: smart-traffic
    spec:
      containers:
        - name: smart-traffic
          image: tuhinnew/smart-traffic:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: smart-traffic-service
spec:
  type: NodePort
  selector:
    app: smart-traffic
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30086
